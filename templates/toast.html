<!-- triathlon/templates/toast.html -->
{% load static %}
<div
    class="fixed bottom-8 right-8 p-4 px-6 rounded-lg shadow-xl z-[100] opacity-0 transition-all duration-500 ease-out translate-y-10 flex items-center gap-4 border-l-4"
    id="toast-component"
    {# Class awal sengaja disembunyikan #}
    style="transform: translateY(100px); opacity: 0;"
>
    {# Ikon akan diisi oleh JS #}
    <span id="toast-icon" class="text-2xl"></span>
    <div>
        {# Judul akan diisi oleh JS #}
        <h3 class="font-bold" id="toast-title"></h3>
        {# Pesan akan diisi oleh JS #}
        <p class="text-sm line-clamp-3" id="toast-message"></p>
    </div>

    <!-- Confirm / Cancel buttons (hidden kecuali mode konfirmasi) -->
    <div id="toast-confirm-actions" style="display:none;" class="ml-4 flex gap-2">
        <button id="toast-confirm-btn" class="bg-red-600 text-white px-3 py-1 rounded text-sm">Confirm</button>
        <button id="toast-cancel-btn" class="bg-gray-200 text-gray-800 px-3 py-1 rounded text-sm">Cancel</button>
    </div>

    {# Tombol close (opsional) #}
    <button onclick="hideToast()" class="ml-auto text-xl hover:opacity-75">&times;</button>
</div>
