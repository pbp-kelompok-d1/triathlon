<!-- Modal -->
<div id="crudModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-gray-800 bg-opacity-50">
  <div id="crudModalContent" class="bg-white rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-screen overflow-y-auto">
    <!-- Modal header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <div>
        <h3 class="text-xl font-semibold text-gray-900">
          Create New Forum Post
        </h3>
        <p class="text-sm text-gray-600 mt-1">Share your thoughts with the triathlon community</p>
      </div>
      <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" onclick="hideModal()">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    <!-- Modal body -->
  <div class="px-6 py-4 space-y-6 form-style">
  <form id="forumPostForm">
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
          <input type="text" id="title" name="title" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black" placeholder="Enter post title" required>
        </div>
        <div class="mb-4">
          <label for="content" class="block text-sm font-medium text-gray-700">Content</label>
          <textarea id="content" name="content" rows="5" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black" placeholder="Enter post content" required></textarea>
        </div>
        <div class="mb-4">
          <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
          <select id="category" name="category" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black" required>
            <option value="">Select a category</option>
            <option value="general">General Discussion</option>
            <option value="product_review">Product Review</option>
            <option value="location_review">Location Review</option>
            <option value="question">Question</option>
            <option value="announcement">Announcement</option>
            <option value="feedback">Feedback</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="sport_category" class="block text-sm font-medium text-gray-700">Sport Category</label>
          <select id="sport_category" name="sport_category" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black" required>
            <option value="">Select a sport</option>
            <option value="running">Running</option>
            <option value="cycling">Cycling</option>
            <option value="swimming">Swimming</option>
          </select>
        </div>
        <div class="mb-4 hidden" id="product_id_field">
          <label for="product_id" class="block text-sm font-medium text-gray-700">Product</label>
          <select id="product_id" name="product_id" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
            <option value="">Select a product (optional)</option>
            {% for prod in products %}
            <option value="{{ prod.pk }}">{{ prod.name }}{% if prod.category %} — {{ prod.get_category_display }}{% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-4 hidden" id="location_id_field">
          <label for="location_id" class="block text-sm font-medium text-gray-700">Location</label>
          <select id="location_id" name="location_id" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
            <option value="">Select a location (optional)</option>
            {% for place in places %}
            <option value="{{ place.pk }}">{{ place.name }}{% if place.city %} — {{ place.city }}{% endif %}</option>
            {% endfor %}
          </select>
        </div>
        {% if user.profile.role == 'ADMIN' %}
        <div class="mb-4">
          <div class="flex items-center">
            <input id="is_pinned" name="is_pinned" type="checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded">
            <label for="is_pinned" class="ml-2 text-sm font-medium text-gray-700">Pin this post</label>
          </div>
        </div>
        {% endif %}
      </form>
    </div>
    <!-- Modal footer -->
    <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
      <button type="button" id="cancelButton" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-100 transition-colors text-center" onclick="hideModal()">Cancel</button>
      <button type="submit" id="submitForumPost" form="forumPostForm" class="order-1 sm:order-2 flex-1 bg-blue-600 text-white px-6 py-3 rounded-md font-bold hover:bg-blue-700 transition-colors">Publish Post</button>
    </div>
  </div>
</div>

<script>
  function showModal() {
      const modal = document.getElementById('crudModal');
      const modalContent = document.getElementById('crudModalContent');

      modal.classList.remove('hidden'); 
      setTimeout(() => {
        modalContent.classList.remove('opacity-0', 'scale-95');
        modalContent.classList.add('opacity-100', 'scale-100');
      }, 50); 
  }

  function hideModal() {
      const modal = document.getElementById('crudModal');
      const modalContent = document.getElementById('crudModalContent');

      modalContent.classList.remove('opacity-100', 'scale-100');
      modalContent.classList.add('opacity-0', 'scale-95');

      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150); 
  }

  document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("forumPostForm").addEventListener("submit", function(e) {
    e.preventDefault();
    addForumPostEntry();
  });

  // Show/hide product/location ID fields based on category selection
  document.getElementById("category").addEventListener("change", function() {
    const category = this.value;
    const productIdField = document.getElementById("product_id_field");
    const locationIdField = document.getElementById("location_id_field");
    const productIdInput = document.getElementById("product_id");
    const locationIdInput = document.getElementById("location_id");
    
    // Hide all fields first
    productIdField.classList.add("hidden");
    locationIdField.classList.add("hidden");
    productIdInput.removeAttribute("required");
    locationIdInput.removeAttribute("required");
    
    // Show relevant field based on category
    if (category === "product_review") {
      productIdField.classList.remove("hidden");
      productIdInput.setAttribute("required", "required");
    } else if (category === "location_review") {
      locationIdField.classList.remove("hidden");
      locationIdInput.setAttribute("required", "required");
    }
  });
});

async function addForumPostEntry() {
  await fetch("{% url 'forum:add_post_ajax' %}", {
    method: "POST",
    body: new FormData(document.querySelector('#forumPostForm')),
    headers: {
      'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
    },
  });

  document.getElementById("forumPostForm").reset();
  hideModal();
  showToast('Forum post added successfully!', '', 'success');
  document.dispatchEvent(new CustomEvent('forumPostAdded'));
  return false;
}
</script>
