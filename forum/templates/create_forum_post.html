{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Header Section -->
<div class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-700 text-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Navigation -->
    <div class="mb-6">
      <a href="{% url 'forum:forums' %}" class="inline-flex items-center text-blue-100 hover:text-white transition-colors">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Forum
      </a>
    </div>

    <!-- Page Header -->
    <div class="text-center">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">
        Create New Post
      </h1>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    
    <!-- Form Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
      <div class="p-8">
        <form method="POST" class="space-y-6">
          {% csrf_token %}
          
          <!-- Title Field -->
          <div>
            <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
              Post Title *
            </label>
            <input 
              type="text" 
              name="{{ form.title.name }}" 
              id="{{ form.title.id_for_label }}"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Enter a descriptive title for your post"
              required
            >
          </div>
          
          <!-- Content Field -->
          <div>
            <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
              Content *
            </label>
            <textarea 
              name="{{ form.content.name }}" 
              id="{{ form.content.id_for_label }}"
              rows="8"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
              placeholder="Write your post content here..."
              required
            ></textarea>
          </div>
          
          <!-- Category Fields -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Category -->
            <div>
              <label for="{{ form.category.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                Category *
              </label>
              <select 
                name="{{ form.category.name }}" 
                id="{{ form.category.id_for_label }}"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required
              >
                {% for value, label in form.category.field.choices %}
                  <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            
            <!-- Sport Category -->
            <div>
              <label for="{{ form.sport_category.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                Sport Category *
              </label>
              <select 
                name="{{ form.sport_category.name }}" 
                id="{{ form.sport_category.id_for_label }}"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required
              >
                {% for value, label in form.sport_category.field.choices %}
                  <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          
          <!-- Optional Fields -->
          {% if form.product_id %}
          <div>
            <label for="{{ form.product_id.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
              Related Product ID (optional)
            </label>
            <input 
              type="number" 
              name="{{ form.product_id.name }}" 
              id="{{ form.product_id.id_for_label }}"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          {% endif %}
          
          {% if form.location_id %}
          <div>
            <label for="{{ form.location_id.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
              Related Location ID (optional)
            </label>
            <input 
              type="number" 
              name="{{ form.location_id.name }}" 
              id="{{ form.location_id.id_for_label }}"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          {% endif %}
          
          <!-- Form Actions -->
          <div class="flex gap-4 pt-6 border-t border-gray-200">
            <button 
              type="submit" 
              class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors"
            >
              Create Post
            </button>
            <a 
              href="{% url 'forum:forums' %}" 
              class="px-6 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors"
            >
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
