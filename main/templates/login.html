{% extends 'base.html' %} 
{% load static %}
{% block meta %}
<title>Login - Triathlon</title>
{% endblock meta %} 

{% block content %}
<div class="flex min-h-screen bg-white">
  <!-- Left Side - Image/Logo Section -->
  <div class="hidden lg:flex lg:w-1/2 bg-gray-200 items-center justify-center p-12">
    <div class="text-center">
      <img src="{% static 'login_logo.png' %}" alt="Triathlon Logo" class="mx-auto max-w-full h-auto" />
    </div>
  </div>

  <!-- Right Side - Login Form -->
  <div class="flex-1 flex items-center justify-center p-8 lg:p-12">
    <div class="w-full max-w-md">
      <!-- Header with Logo and Sign up link -->
      <div class="flex justify-between items-center mb-12">
        <img src="{% static 'navbar_logo.png' %}" alt="Logo" class="h-10" />
        <!-- <a href="{% url 'main:register' %}" class="text-sm text-gray-600 hover:text-gray-800">Sign up</a> -->
      </div>

      <!-- Login Form -->
      <form id="loginForm" method="POST" action="" class="space-y-6">
        {% csrf_token %}
        
        <div>
          <label for="id_username" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input
            type="text"
            name="username"
            autofocus
            autocapitalize="none"
            autocomplete="username"
            maxlength="150"
            required
            id="id_username"
            class="block w-full px-4 py-3 text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="Enter your username"
          />
        </div>

        <div>
          <label for="id_password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              id="id_password"
              class="block w-full px-4 py-3 pr-10 text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="Enter your password"
            />
            <button type="button" onclick="togglePasswordLogin()" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer hover:text-gray-600">
              <svg id="eyeIconLogin" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <!-- Forgot Password -->
          <!-- <div class="text-right mt-2">
            <a href="#" class="text-sm text-indigo-600 hover:text-indigo-700">Forgot the password?</a>
          </div> -->
        </div>

        <div>
          <button
            type="submit"
            id="loginButton"
            class="w-full px-4 py-3 text-base font-medium text-white bg-indigo-600 rounded-lg shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
          >
            Sign in
          </button>
        </div>
      </form>

      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account? 
          <a href="{% url 'main:register' %}" class="text-indigo-600 hover:text-indigo-700 font-medium">Register Here</a>
        </p>
      </div>

      {% if messages %}
      <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
        <ul class="text-sm text-yellow-800 list-disc list-inside">
          {% for message in messages %}
          <li>{{ message }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <!-- Footer -->
      <!-- <div class="mt-12 pt-8 border-t border-gray-200">
        <div class="flex justify-center space-x-6 text-xs text-gray-500">
          <a href="#" class="hover:text-gray-700">Terms & Conditions</a>
          <a href="#" class="hover:text-gray-700">Privacy Policy</a>
          <a href="#" class="hover:text-gray-700">About CompVerse</a>
        </div>
        <p class="text-xs text-gray-400 text-center mt-4">© 2023 Copyright by IK Developers. All rights reserved.</p>
      </div>
    </div> -->
  </div>
</div>

<script>
// Toggle password visibility for login
function togglePasswordLogin() {
  const passwordInput = document.getElementById('id_password');
  const eyeIcon = document.getElementById('eyeIconLogin');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    // Change to "eye-off" icon
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
    `;
  } else {
    passwordInput.type = 'password';
    // Change back to "eye" icon
    eyeIcon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    `;
  }
}

document.addEventListener("DOMContentLoaded", function() {
  const loginForm = document.getElementById("loginForm");
  if (loginForm) {
    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      loginUser();
    });
  }
});

function showToast(title, message, type) {
  // Simple alert fallback
  if (type === 'success') {
    console.log('Success:', title, message);
  } else {
    alert(title + (message ? ': ' + message : ''));
  }
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

async function loginUser() {
  const loginButton = document.getElementById('loginButton');
  const originalText = loginButton.textContent;
  const formElement = document.getElementById('loginForm');
  const formData = new FormData(formElement);

  // Show loading state
  loginButton.disabled = true;
  loginButton.textContent = 'Signing in...';

  try {
    const response = await fetch("{% url 'main:login' %}", {
      method: "POST",
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    });

    if (response.ok) {
      showToast('Login successful!', '', 'success');
      setTimeout(() => {
        window.location.href = "{% url 'main:show_main' %}";
      }, 1000);
    } else {
      const errorData = await response.text();
      showToast('Login failed', 'Please check your username and password', 'error');
    }
  } catch (error) {
    console.error('Error:', error);
    showToast('Login error', 'Something went wrong', 'error');
  } finally {
    // Reset button state
    loginButton.disabled = false;
    loginButton.textContent = originalText;
  }
}
</script>

{% endblock content %}
