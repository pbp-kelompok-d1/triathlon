{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
          <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-slate-800">Confirm Deletion</h2>
        <p class="text-slate-600 mt-2">
            Are you sure you want to delete ticket <strong>#{{ ticket.id }}</strong> for <strong>{{ ticket.customer_name }}</strong>?
        </p>
        <p class="text-sm text-red-600 mt-1">This action cannot be undone.</p>

        <form method="POST" class="mt-6">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <a href="{% url 'ticket:ticket_list' %}" class="bg-slate-200 text-slate-800 font-bold py-2 px-6 rounded-lg hover:bg-slate-300 transition-colors">
                    Cancel
                </a>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
