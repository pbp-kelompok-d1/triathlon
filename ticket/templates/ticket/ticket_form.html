{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white p-8 rounded-xl shadow-lg">
        <h1 id="form-title" class="text-3xl font-bold text-slate-900 mb-6 border-b pb-4">
            {% if is_create %}Book a New Ticket{% else %}Edit Ticket #{{ ticket.id }}{% endif %}
        </h1>
        
        <form id="ticket-form" method="POST" action="">
            {% csrf_token %}
            <div id="form-errors" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"></div>
            <div class="space-y-6">
                {{ form.as_p }}
            </div>
            <div class="mt-8 flex justify-end gap-4">
                <a href="{% url 'ticket:ticket_list' %}" class="bg-slate-200 text-slate-800 font-bold py-2 px-4 rounded-lg hover:bg-slate-300">Cancel</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-5 rounded-lg shadow-md">Submit</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('ticket-form');
    const formErrorsDiv = document.getElementById('form-errors');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(form);
        const url = form.getAttribute('action') || window.location.pathname;
        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrfToken,
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            const data = await response.json();

            if (response.ok && data.success) {
                alert(data.message); // Or use a toast notification
                window.location.href = "{% url 'ticket:ticket_list' %}"; // Redirect to list page
            } else {
                // Display errors
                formErrorsDiv.innerHTML = '';
                let errorHtml = '<strong>Please correct the following errors:</strong><ul>';
                for (const field in data.errors) {
                    errorHtml += `<li>${field}: ${data.errors[field][0].message}</li>`;
                }
                errorHtml += '</ul>';
                formErrorsDiv.innerHTML = errorHtml;
                formErrorsDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Form submission error:', error);
            formErrorsDiv.textContent = 'A server error occurred. Please try again later.';
            formErrorsDiv.classList.remove('hidden');
        }
    });
});
</script>
{% endblock %}
