{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-slate-900">Ticket</h1>
            <p class="text-slate-600">Manage all ticket bookings.</p>
        </div>
        <a href="{% url 'ticket:ticket_create' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition">
            + Book New Ticket
        </a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
        <form id="filter-form">
            <input type="text" name="search" placeholder="Search by name, place, or ID..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </form>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Customer</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Place</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody id="ticket-table-body" class="bg-white divide-y divide-gray-200">
                </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const filterForm = document.getElementById('filter-form');
    const searchInput = filterForm.querySelector('input[name="search"]');
    const tableBody = document.getElementById('ticket-table-body');
    const csrfToken = document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];

    const fetchAndRenderTickets = async () => {
        const query = searchInput.value;
        const url = `{% url 'ticket:ticket_list' %}?search=${query}`;

        try {
            const response = await fetch(url, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            
            tableBody.innerHTML = ''; // Clear existing rows

            if (data.tickets.length > 0) {
                data.tickets.forEach(ticket => {
                    const row = `
                        <tr id="ticket-row-${ticket.id}">
                            <td class="px-6 py-4 font-medium">#${ticket.id}</td>
                            <td class="px-6 py-4">${ticket.customer_name}</td>
                            <td class="px-6 py-4">${ticket.place__name}</td>
                            <td class="px-6 py-4">${ticket.booking_date}</td>
                            <td class="px-6 py-4 font-semibold">$${parseFloat(ticket.total_price).toFixed(2)}</td>
                            <td class="px-6 py-4 text-center space-x-2">
                                <a href="/detail/${ticket.id}/" class="text-blue-600 hover:underline">Details</a>
                                <a href="/update/${ticket.id}/" class="text-yellow-600 hover:underline">Edit</a>
                                <button class="delete-btn text-red-600 hover:underline" data-id="${ticket.id}">Delete</button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-gray-500">No tickets found.</td></tr>';
            }
        } catch (error) {
            console.error('Error fetching tickets:', error);
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-red-500">Failed to load data.</td></tr>';
        }
    };

    // Initial load
    fetchAndRenderTickets();

    // Filter on input change
    searchInput.addEventListener('input', fetchAndRenderTickets);

    // Handle delete action using event delegation
    tableBody.addEventListener('click', async (e) => {
        if (e.target.classList.contains('delete-btn')) {
            const ticketId = e.target.dataset.id;
            if (confirm(`Are you sure you want to delete ticket #${ticketId}?`)) {
                try {
                    const response = await fetch(`/delete/${ticketId}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': csrfToken,
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });
                    const data = await response.json();
                    if (data.success) {
                        document.getElementById(`ticket-row-${ticketId}`).remove();
                        alert(data.message); // Replace with a toast notification for better UX
                    } else {
                        alert(`Error: ${data.message}`);
                    }
                } catch (error) {
                    console.error('Error deleting ticket:', error);
                    alert('An error occurred while deleting the ticket.');
                }
            }
        }
    });
});
</script>
{% endblock %}
