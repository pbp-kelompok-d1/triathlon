{% extends 'base.html' %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Tiket</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
        }
        button {
            background-color: #2b7cff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a5fcc;
        }
    </style>
</head>
<body>
    <h1>Booking Tiket Fasilitas</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Pesan Sekarang</button>
    </form>

    {% if messages %}
        <ul style="margin-top:20px; color: green;">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
