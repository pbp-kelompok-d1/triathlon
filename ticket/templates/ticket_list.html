{% extends 'base.html' %}
<html>
<head>
    <title>Daftar Tiket</title>
</head>
<body>
    <h1>Daftar Tiket</h1>
    <a href="{% url 'ticket:book_ticket' %}">+ Pesan Tiket Baru</a>

    <ul>
        {% for t in ticket %}
        <li>{{ t.place_name }} — {{ t.visit_date }} — Rp {{ t.total_price }}</li>
        {% empty %}
        <li>Belum ada tiket.</li>
        {% endfor %}
    </ul>
</body>
</html>
