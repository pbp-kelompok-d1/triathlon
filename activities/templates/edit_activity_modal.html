<div id="editActivityModal" class="hidden fixed inset-0 z-50 w-full h-full flex items-center justify-center bg-gray-800 bg-opacity-50">
<div class="bg-white rounded-lg shadow-lg w-11/12 sm:w-3/4 md:w-1/2 lg:w-2/5 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-4 border-b">
    <h3 class="text-xl font-semibold text-gray-900">Edit Activity</h3>
    <button type="button" class="text-gray-400 hover:text-gray-700" onclick="hideEditActivityModal()">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
    </button>
    </div>

    <div class="px-6 py-4 space-y-4">
        <div>
            <label for="edit_place_id" class="block text-sm font-medium text-gray-700">Place ID</label>
            <input id="edit_place_id" type="number" min="1"
                    class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
        </div>

    <div>
        <label for="edit_title" class="block text-sm font-medium text-gray-700">Title</label>
        <input id="edit_title" type="text" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div>
        <label for="edit_duration_hours" class="block text-sm font-medium text-gray-700">Hours</label>
        <input id="edit_duration_hours" type="number" min="0" step="1" required
                class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
        </div>
        <div>
        <label for="edit_duration_minutes" class="block text-sm font-medium text-gray-700">Minutes</label>
        <input id="edit_duration_minutes" type="number" min="0" max="59" step="1" required
                class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
        </div>
    </div>

    <div>
        <label for="edit_distance" class="block text-sm font-medium text-gray-700">Distance (meters)</label>
        <input id="edit_distance" type="number" min="0" required
            class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
    </div>

    <div>
        <label for="edit_sport_category" class="block text-sm font-medium text-gray-700">Sport</label>
        <select id="edit_sport_category" required
                class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
        <option value="">Select a sport</option>
        <option value="running">Running</option>
        <option value="cycling">Cycling</option>
        <option value="swimming">Swimming</option>
        </select>
    </div>

    <div>
        <label for="edit_done_at" class="block text-sm font-medium text-gray-700">Date</label>
        <input id="edit_done_at" type="date" required
            class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black">
    </div>

    <div>
        <label for="edit_notes" class="block text-sm font-medium text-gray-700">Notes (optional)</label>
        <textarea id="edit_notes" rows="4"
                class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-black"></textarea>
    </div>
    </div>

    <div class="flex gap-3 p-6 border-t">
    <button type="button" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-100"
            onclick="hideEditActivityModal()">Cancel</button>
    <button type="button" id="submitEditBtn"
            class="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-indigo-700">
        Save Changes
    </button>
    </div>
</div>
</div>
