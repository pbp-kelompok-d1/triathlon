
<div id="viewActivityModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50" onclick="hideViewActivityModal()"></div>
  <div class="relative mx-auto mt-16 w-full max-w-2xl rounded-xl bg-white shadow-lg">
    <div class="flex items-center justify-between px-5 py-4 border-b">
      <h3 id="view_title" class="text-lg font-semibold text-gray-900">Activity</h3>
      <button class="text-gray-500 hover:text-gray-700" onclick="hideViewActivityModal()">✕</button>
    </div>

    <div class="px-5 py-4 space-y-3">
      <div id="view_meta" class="text-sm text-gray-600"></div>

      <div class="grid grid-cols-3 gap-3 text-sm">
        <div class="p-3 bg-gray-50 rounded">
          <div class="font-medium">Duration</div>
          <div id="view_duration" class="text-gray-800">—</div>
        </div>
        <div class="p-3 bg-gray-50 rounded">
          <div class="font-medium">Distance</div>
          <div id="view_distance" class="text-gray-800">—</div>
        </div>
        <div class="p-3 bg-gray-50 rounded">
          <div class="font-medium">Calories</div>
          <div id="view_calories" class="text-gray-800">—</div>
        </div>
      </div>

      <div class="text-sm">
        <div class="font-medium mb-1">Notes</div>
        <div id="view_notes" class="whitespace-pre-wrap text-gray-800">—</div>
      </div>
    </div>

    <div class="px-5 py-4 border-t text-right">
      <button class="px-4 py-2 rounded bg-gray-100 hover:bg-gray-200" onclick="hideViewActivityModal()">Close</button>
    </div>
  </div>
</div>
