{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Konfirmasi Pesanan</h1>

    <div class="bg-white rounded shadow">
      <div class="p-4 border-b">
        <h2 class="font-semibold">Ringkasan</h2>
      </div>
      <div class="divide-y">
        {% for item in cart_items %}
        <div class="p-4 flex justify-between">
          <div>
            <div class="font-medium">{{ item.product.name }}</div>
            <div class="text-sm text-gray-600">Qty: {{ item.quantity }}</div>
          </div>
          <div class="font-semibold">Rp {{ item.subtotal|floatformat:0 }}</div>
        </div>
        {% endfor %}
      </div>
      <div class="p-4 border-t flex justify-between">
        <span class="font-semibold">Total</span>
        <span class="text-green-600 font-bold">Rp {{ total|floatformat:0 }}</span>
      </div>
    </div>

    <form method="POST" class="mt-6">
      {% csrf_token %}
      <div class="flex gap-3">
        <a href="{% url 'shop:view_cart' %}" class="flex-1 text-center bg-gray-500 hover:bg-gray-600 text-white py-3 rounded">Kembali</a>
        <button id="confirm-btn" type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded">
          Konfirmasi Beli
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
