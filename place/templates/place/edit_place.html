{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto p-6 bg-white shadow rounded-2xl">
  <h1 class="text-2xl font-semibold mb-6">Edit Tempat: {{ place.name }}</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
      Simpan Perubahan
    </button>
  </form>
</div>
{% endblock %}
