{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto mt-12 mb-20 bg-white shadow-2xl rounded-xl p-8 border border-gray-100">
  
  <h1 class="text-3xl font-bold mb-8 text-gray-800 border-b pb-4">📝 Tambah Tempat Baru</h1>
  
  <form method="POST" enctype="multipart/form-data" class="space-y-6">
    {% csrf_token %}
    
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-2">
          {{ field.label }}
        </label>
        
        {{ field }}
        
        {% for error in field.errors %}
          <p class="mt-1 text-xs text-red-600">{{ error }}</p>
        {% endfor %}
        
        {% if field.help_text %}
          <p class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>
        {% endif %}
      </div>
    {% endfor %}
    
    <div class="pt-4">
      <button type="submit" class="w-full bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-all font-bold text-lg shadow-lg">
        Simpan Tempat
      </button>
    </div>
    
  </form>
</div>
{% endblock %}
