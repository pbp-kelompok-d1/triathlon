{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto mt-12 bg-white shadow-lg rounded-xl p-8">
  <h1 class="text-2xl font-bold mb-6">Tambah Tempat Baru</h1>
  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Simpan</button>
  </form>
</div>
{% endblock %}
